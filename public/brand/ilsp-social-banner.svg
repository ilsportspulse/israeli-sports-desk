<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Israel Sports Pulse social banner</title>
  <desc id="desc">A premium navy social banner built from the compact ILSP app mark and master wordmark.</desc>
  <rect width="1500" height="500" fill="#07152f"/>
  <g aria-label="ILSP compact mark">
    <rect x="82" y="105" width="290" height="290" rx="70" fill="#0b1b3a" stroke="#294f9f" stroke-width="3"/>
    <g transform="skewX(-7)">
      <text x="121" y="281" fill="#ffffff" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="126" font-weight="900" letter-spacing="-15">ILSP</text>
    </g>
    <g transform="translate(82 105) scale(3.0208333)">
      <path d="M79 6l2.75 5h5.75l-3 5 3 5h-5.75L79 26l-2.75-5H70.5l3-5-3-5h5.75zM79 12l3.2 2v4L79 20l-3.2-2v-4z" fill="#4f7dff" fill-rule="evenodd" transform="rotate(8 79 16)"/>
