<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Paris Lee signs for Ironi Ness Ziona</title>
  <desc id="desc">Editorial signing graphic showing Paris Lee's two-year agreement and verified EuroLeague career markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081527"/>
      <stop offset=".58" stop-color="#123655"/>
      <stop offset="1" stop-color="#ed6c22"/>
    </linearGradient>
    <pattern id="court" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M90 0H0V90" fill="none" stroke="#fff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#court)"/>
  <circle cx="1370" cy="440" r="310" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
  <circle cx="1370" cy="440" r="118" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/>
  <text x="95" y="127" fill="#ffb07b" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="7">IRONI NESS ZIONA • 2026/27</text>
  <text x="90" y="284" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="113" font-weight="900">PARIS LEE</text>
  <rect x="95" y="339" width="530" height="102" rx="16" fill="#ed6c22"/>
  <text x="136" y="407" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">TWO-YEAR DEAL</text>
  <text x="95" y="541" fill="#b8d0e1" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4">VERIFIED EUROLEAGUE RECORD</text>
  <text x="95" y="660" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="900">128</text>
  <text x="315" y="625" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">GAMES</text>
  <text x="315" y="671" fill="#b8d0e1" font-family="Arial, Helvetica, sans-serif" font-size="26">2021–2025</text>
  <line x1="560" y1="568" x2="560" y2="696" stroke="#fff" stroke-opacity=".2"/>
  <text x="615" y="633" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="900">1.7 STL</text>
  <text x="615" y="675" fill="#b8d0e1" font-family="Arial, Helvetica, sans-serif" font-size="24">2023/24 EUROLEAGUE LEADER</text>
  <text x="95" y="776" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">UNICS KAZAN</text>
  <path d="M350 765h265" stroke="#ff9b5d" stroke-width="8" stroke-linecap="round"/>
  <path d="m595 744 36 21-36 21" fill="none" stroke="#ff9b5d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="677" y="776" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">IRONI NESS ZIONA</text>
  <text x="1490" y="835" text-anchor="end" fill="#d5e4ee" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3">ILSP VISUAL DESK</text>
