<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Presidential attendance confirmed for the World Cup final</title>
  <desc id="desc">Editorial event card showing Argentina against Spain at 15:00 on Sunday 19 July at New York New Jersey Stadium.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061427"/>
      <stop offset="0.55" stop-color="#102c4f"/>
      <stop offset="1" stop-color="#5a1830"/>
    </linearGradient>
    <radialGradient id="light" cx="82%" cy="18%" r="78%">
      <stop offset="0" stop-color="#ff5b6e" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff5b6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020712" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#light)"/>
  <path d="M0 542 C229 425 419 608 657 500 S1006 404 1200 490 V675 H0Z" fill="#050d1b" opacity=".72"/>
  <g opacity=".15" fill="none" stroke="#fff">
    <circle cx="1036" cy="328" r="250" stroke-width="2"/>
    <circle cx="1036" cy="328" r="176" stroke-width="2"/>
    <path d="M786 328h500M1036 78v500" stroke-width="2"/>
  </g>
  <g transform="translate(76 66)">
    <rect width="240" height="40" rx="20" fill="#ff5b6e"/>
    <text x="120" y="27" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="2">ILSP WORLD CUP DESK</text>
    <text x="0" y="112" fill="#9fb7d0" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4">HOST-NATION PRESENCE</text>
    <text x="0" y="176" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900">TRUMP AT THE</text>
    <text x="0" y="235" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="900">WORLD CUP FINAL</text>
    <rect x="0" y="270" width="662" height="2" fill="#ff5b6e"/>
    <text x="0" y="318" fill="#d8e5ef" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Sunday 19 July · New York New Jersey</text>
  </g>
  <g transform="translate(804 124)" filter="url(#shadow)">
    <rect width="306" height="350" rx="32" fill="#f7fafc"/>
    <rect x="24" y="24" width="258" height="50" rx="16" fill="#0b213c"/>
    <text x="153" y="57" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="2">FINAL KICK-OFF</text>
    <text x="153" y="194" text-anchor="middle" fill="#0a213b" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="900">15:00</text>
    <path d="M58 232h190" stroke="#ef3f58" stroke-width="5" stroke-linecap="round"/>
    <text x="153" y="278" text-anchor="middle" fill="#385b78" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">ARGENTINA</text>
    <text x="153" y="307" text-anchor="middle" fill="#8a9dad" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">V</text>
    <text x="153" y="334" text-anchor="middle" fill="#385b78" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800">SPAIN</text>
  </g>
  <g transform="translate(76 572)">
    <circle cx="13" cy="13" r="13" fill="#ff5b6e"/>
    <path d="M8 13l4 4 7-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="20" fill="#edf4f9" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">White House attendance confirmed</text>
  </g>
  <text x="1124" y="624" text-anchor="end" fill="#9bb1c4" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ISRAEL SPORTS PULSE</text>
