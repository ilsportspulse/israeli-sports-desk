<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Rani Cohen appointed Hapoel Eilat chief executive</title>
  <desc id="desc">An ILSP editorial graphic combining the appointment with Hapoel Eilat's verified 29 and 1 promotion record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152e"/>
      <stop offset=".6" stop-color="#06396d"/>
      <stop offset="1" stop-color="#087ba2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d63ff"/>
      <stop offset="1" stop-color="#40d3ff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1340" cy="155" r="390" fill="#40d3ff" opacity=".08"/>
  <path d="M1220 0v570M1220 285h380M1220 135h165v300h-165M1385 210a90 90 0 0 1 0 150" fill="none" stroke="#d7f6ff" stroke-width="4" opacity=".19"/>
  <rect x="90" y="80" width="360" height="58" rx="29" fill="url(#accent)"/>
  <text x="270" y="120" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" letter-spacing="5">NEW EXECUTIVE</text>
  <text x="90" y="280" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="800" letter-spacing="-3">RANI COHEN</text>
  <text x="94" y="345" fill="#a9c4e5" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="7">HAPOEL EILAT · CHIEF EXECUTIVE</text>
  <line x1="92" y1="405" x2="1060" y2="405" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="95" y="565" fill="#8faed2" font-size="24" font-weight="700" letter-spacing="5">2025–26 NATIONAL LEAGUE</text>
    <text x="95" y="750" fill="#fff" font-size="190" font-weight="800">29–1</text>
    <text x="690" y="565" fill="#8faed2" font-size="24" font-weight="700" letter-spacing="5">POINTS PER GAME</text>
    <text x="690" y="690" fill="#fff" font-size="102" font-weight="800">94.2</text>
    <text x="1065" y="565" fill="#8faed2" font-size="24" font-weight="700" letter-spacing="5">PROMOTION</text>
    <text x="1065" y="690" fill="#54dbff" font-size="68" font-weight="800">TOP FLIGHT</text>
    <text x="690" y="792" fill="#9ab8d8" font-size="28" font-weight="700">78.1 allowed · 30 regular-season games</text>
  </g>
  <rect x="90" y="895" width="1420" height="2" fill="#7da4cd" opacity=".40"/>
  <text x="90" y="952" fill="#90aed0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">ISRAEL SPORTS PULSE · CLUB PERFORMANCE</text>
</svg>
