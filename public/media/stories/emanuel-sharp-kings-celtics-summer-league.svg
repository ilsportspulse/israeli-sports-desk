<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Emanuel Sharp performance visual for Sacramento against Boston</title>
  <desc id="desc">An original ILSP basketball court visual showing Sharp's 12 points, two steals and zero turnovers in Sacramento's 82 to 76 Summer League loss to Boston.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06142d"/>
      <stop offset="0.58" stop-color="#102d5f"/>
      <stop offset="1" stop-color="#1762ed"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5d90ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#5d90ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1315" cy="210" r="410" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="5">
    <path d="M1030 0v900M1030 450h570"/>
    <circle cx="1030" cy="450" r="155"/>
    <path d="M1600 190h-285v520h285M1430 350h170M1430 550h170"/>
    <circle cx="1455" cy="450" r="12" fill="#ffffff" fill-opacity=".22"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="95" y="115" font-size="26" font-weight="700" letter-spacing="7" fill="#83a9ff">ISRAELIS ABROAD · SUMMER LEAGUE</text>
    <text x="95" y="270" font-size="86" font-style="italic" font-weight="900">EMANUEL SHARP</text>
    <text x="99" y="326" font-size="28" font-weight="700" letter-spacing="4" fill="#bdcbe4">SACRAMENTO KINGS · GUARD</text>
    <text x="95" y="560" font-size="190" font-weight="900">12</text>
    <text x="100" y="612" font-size="27" font-weight="800" letter-spacing="5" fill="#83a9ff">POINTS</text>
    <text x="430" y="560" font-size="118" font-weight="900">2</text>
    <text x="435" y="612" font-size="27" font-weight="800" letter-spacing="5" fill="#83a9ff">STEALS</text>
    <text x="690" y="560" font-size="118" font-weight="900">0</text>
    <text x="695" y="612" font-size="27" font-weight="800" letter-spacing="5" fill="#83a9ff">TURNOVERS</text>
    <text x="96" y="770" font-size="32" font-weight="800">BOSTON 82</text>
    <text x="326" y="770" font-size="24" font-weight="700" fill="#83a9ff">FINAL</text>
    <text x="430" y="770" font-size="32" font-weight="800">SACRAMENTO 76</text>
    <text x="95" y="835" font-size="20" font-weight="700" letter-spacing="5" fill="#9fb2d2">ISRAEL SPORTS PULSE · VERIFIED PERFORMANCE</text>
  </g>
  <g transform="translate(1250 680)" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0-74 43 0 0 74-43 0Z"/>
    <path d="M-43 0h86M-21-37h42M-21 37h42"/>
  </g>
</svg>
