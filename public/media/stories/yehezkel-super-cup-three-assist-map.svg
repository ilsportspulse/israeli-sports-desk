<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sagiv Yehezkel's three-assist Super Cup performance</title>
  <desc id="desc">An ILSP editorial football visual marking Yehezkel's assists in the 10th, 58th and 72nd minutes of Maccabi Tel Aviv's 3-1 Super Cup win over Hapoel Be'er Sheva.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f35"/>
      <stop offset="1" stop-color="#0d3852"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4c94a"/>
      <stop offset="1" stop-color="#ffe99a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020b13" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 0H1200V675H0Z" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <path d="M-60 590C280 450 780 760 1260 505" fill="none" stroke="#25a37d" stroke-opacity=".18" stroke-width="150"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="72" y="72" fill="#8fe6cc" font-size="20" font-weight="700" letter-spacing="3">ILSP TACTICAL BOARD</text>
    <text x="72" y="127" fill="#ffffff" font-size="44" font-weight="800">Three deliveries, one pressure valve</text>
    <text x="72" y="165" fill="#c9d9e5" font-size="22">Sagiv Yehezkel • Israel Super Cup • 16 July 2026</text>

    <g transform="translate(72 220)" filter="url(#shadow)">
      <rect width="1056" height="304" rx="26" fill="#f7fafc"/>
      <path d="M352 0V304M704 0V304" stroke="#d7e1e8" stroke-width="2"/>

      <g transform="translate(34 34)">
        <circle cx="42" cy="42" r="42" fill="#0d3852"/>
        <text x="42" y="51" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">10'</text>
        <text x="0" y="121" fill="#122b40" font-size="24" font-weight="800">RIGHT-CHANNEL RELEASE</text>
        <text x="0" y="159" fill="#426177" font-size="20">Noy finds Yehezkel;</text>
        <text x="0" y="188" fill="#426177" font-size="20">Abu Farchi finishes.</text>
        <path d="M5 224H270" stroke="#25a37d" stroke-width="8" stroke-linecap="round"/>
        <path d="M248 207L276 224L248 241" fill="none" stroke="#25a37d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(386 34)">
        <circle cx="42" cy="42" r="42" fill="#0d3852"/>
        <text x="42" y="51" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">58'</text>
        <text x="0" y="121" fill="#122b40" font-size="24" font-weight="800">OPPOSITE-SIDE SUPPLY</text>
        <text x="0" y="159" fill="#426177" font-size="20">Yehezkel creates left;</text>
        <text x="0" y="188" fill="#426177" font-size="20">Peretz places the finish.</text>
        <path d="M5 224H270" stroke="#25a37d" stroke-width="8" stroke-linecap="round"/>
        <path d="M248 207L276 224L248 241" fill="none" stroke="#25a37d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g transform="translate(738 34)">
        <circle cx="42" cy="42" r="42" fill="#0d3852"/>
        <text x="42" y="51" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">72'</text>
        <text x="0" y="121" fill="#122b40" font-size="24" font-weight="800">TEN-MAN OUTLET</text>
        <text x="0" y="159" fill="#426177" font-size="20">Third assist arrives;</text>
        <text x="0" y="188" fill="#426177" font-size="20">Abu Farchi seals 3–1.</text>
        <path d="M5 224H270" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
        <path d="M248 207L276 224L248 241" fill="none" stroke="#f4c94a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <text x="72" y="579" fill="#ffffff" font-size="28" font-weight="800">Maccabi Tel Aviv 3–1 Hapoel Be'er Sheva</text>
    <text x="72" y="617" fill="#a9bdcc" font-size="20">Abu Farchi 10', 72' • Peretz 58' • Revivo sent off 66'</text>
    <text x="1128" y="617" text-anchor="end" fill="#8fe6cc" font-size="20" font-weight="800">ISRAEL SPORTS PULSE</text>
  </g>
</svg>
