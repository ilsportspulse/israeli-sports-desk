<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Daniel Warku player-status compensation decision</title>
  <desc id="desc">Editorial data graphic showing the reported NIS 240,000 compensation award and registration route from Hapoel Ramat Gan to Beitar Jerusalem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182b"/>
      <stop offset="1" stop-color="#102c4e"/>
    </linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0V70" fill="none" stroke="#7bb3e8" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="72" y="62" width="1456" height="776" rx="28" fill="none" stroke="#f5c842" stroke-width="2"/>
  <text x="120" y="142" fill="#f5c842" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="7">PLAYER STATUS DECISION</text>
  <text x="120" y="236" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800">DANIEL WARKU</text>
  <line x1="120" y1="277" x2="1480" y2="277" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="120" y="386" fill="#9fb7cf" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">COMPENSATION AWARD</text>
  <text x="120" y="526" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="900">NIS 240,000</text>
  <rect x="1045" y="354" width="430" height="190" rx="18" fill="#f5c842"/>
  <text x="1082" y="413" fill="#07182b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="2">REPORTED INITIAL CLAIM</text>
  <text x="1082" y="489" fill="#07182b" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900">NIS 1.2M</text>
  <text x="120" y="656" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">HAPOEL RAMAT GAN</text>
  <path d="M555 645h320" stroke="#f5c842" stroke-width="8" stroke-linecap="round"/>
  <path d="m855 625 34 20-34 20" fill="none" stroke="#f5c842" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="930" y="656" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">BEITAR JERUSALEM</text>
  <rect x="120" y="714" width="1355" height="72" rx="12" fill="#ffffff" fill-opacity=".08"/>
  <circle cx="160" cy="750" r="13" fill="#42d48b"/>
  <text x="194" y="760" fill="#dce9f5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">REGISTRATION PATH CLEARED AFTER REPORTED AWARD</text>
  <text x="1475" y="815" text-anchor="end" fill="#9fb7cf" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3">ILSP VISUAL DESK</text>
</svg>
