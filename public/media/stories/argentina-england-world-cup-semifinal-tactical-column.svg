<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Argentina versus England World Cup semi-final tactical board</title>
  <desc id="desc">An Israel Sports Pulse editorial diagram of the central tactical spaces around Lionel Messi and Jude Bellingham.</desc>
  <defs>
