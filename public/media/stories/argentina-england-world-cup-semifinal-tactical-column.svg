      <stop offset="0.5" stop-color="#0b2142"/>
      <stop offset="1" stop-color="#07152c"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#174c48"/>
      <stop offset="1" stop-color="#0d3738"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
