<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tiemoko Diarra transfer route to Kasımpaşa</title>
  <desc id="desc">Editorial route graphic showing a reported Hapoel Tel Aviv agreement that did not reach personal terms and Diarra's official signing for Kasımpaşa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061323"/>
      <stop offset="1" stop-color="#0d3044"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#8bcdd9" fill-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <text x="100" y="125" fill="#7dd7e5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="7">TRANSFER ROUTE • 16 JULY 2026</text>
  <text x="96" y="250" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900">TIEMOKO DIARRA</text>
  <text x="100" y="324" fill="#afc5d5" font-family="Arial, Helvetica, sans-serif" font-size="30">FROM STADE DE REIMS • DESTINATION CONFIRMED</text>
  <rect x="92" y="400" width="600" height="305" rx="26" fill="#ffffff" fill-opacity=".07" stroke="#d63743" stroke-width="3"/>
  <text x="140" y="472" fill="#ff8992" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="3">ROUTE NOT COMPLETED</text>
  <text x="140" y="554" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="900">HAPOEL TEL AVIV</text>
  <text x="140" y="619" fill="#cfdae3" font-family="Arial, Helvetica, sans-serif" font-size="25">CLUB AGREEMENT REPORTED</text>
  <text x="140" y="660" fill="#ff8992" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">PERSONAL TERMS NOT CLOSED</text>
  <path d="M720 552h145" stroke="#7dd7e5" stroke-width="8" stroke-linecap="round"/>
  <path d="m845 528 42 24-42 24" fill="none" stroke="#7dd7e5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="910" y="400" width="600" height="305" rx="26" fill="#e7f8fb"/>
  <text x="958" y="472" fill="#096a7b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="3">OFFICIAL DESTINATION</text>
  <text x="958" y="554" fill="#061323" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">KASIMPAŞA</text>
  <text x="958" y="623" fill="#27495a" font-family="Arial, Helvetica, sans-serif" font-size="25">CONTRACT SIGNED AT CLUB FACILITIES</text>
  <circle cx="978" cy="664" r="12" fill="#20b879"/>
  <text x="1006" y="674" fill="#096a7b" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">CLUB ANNOUNCEMENT CONFIRMED</text>
  <text x="100" y="801" fill="#afc5d5" font-family="Arial, Helvetica, sans-serif" font-size="22">NO CONTRACT LENGTH WAS SPECIFIED IN THE OFFICIAL ANNOUNCEMENT</text>
  <text x="1500" y="836" text-anchor="end" fill="#8aa8ba" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3">ILSP VISUAL DESK</text>
</svg>
