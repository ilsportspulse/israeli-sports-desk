<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Radinio Balker contract through 2028</title>
  <desc id="desc">Editorial contract card showing the 2028 term and the effect on Maccabi Haifa's defensive recruitment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0d2d42"/>
      <stop offset="1" stop-color="#0a594d"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="18%" r="72%">
      <stop offset="0" stop-color="#36e0b2" stop-opacity=".34"/>
      <stop offset="1" stop-color="#36e0b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020812" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <path d="M0 527 C220 438 387 611 619 493 S982 408 1200 500 V675 H0Z" fill="#06111f" opacity=".74"/>
  <g opacity=".13" stroke="#fff" fill="none">
    <circle cx="1000" cy="338" r="258" stroke-width="2"/>
    <circle cx="1000" cy="338" r="183" stroke-width="2"/>
    <path d="M742 338h516M1000 80v516" stroke-width="2"/>
  </g>
  <g transform="translate(78 72)">
    <rect width="236" height="40" rx="20" fill="#37e5b7"/>
    <text x="118" y="27" text-anchor="middle" fill="#051721" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="2">ILSP CONTRACT DESK</text>
    <text x="0" y="114" fill="#9ab5c8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="4">RADINIO BALKER</text>
    <text x="0" y="176" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900">STAYS IN</text>
    <text x="0" y="235" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900">HUDDERSFIELD</text>
    <rect x="0" y="272" width="650" height="2" fill="#37e5b7"/>
    <text x="0" y="323" fill="#d7e5ed" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Centre-back commitment reshapes Haifa's search</text>
  </g>
  <g transform="translate(786 130)" filter="url(#shadow)">
    <rect width="314" height="330" rx="34" fill="#f7fbfd"/>
    <rect x="24" y="24" width="266" height="52" rx="17" fill="#0b2437"/>
    <text x="157" y="58" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="2">CONTRACTED TO</text>
    <text x="157" y="220" text-anchor="middle" fill="#082438" font-family="Arial, Helvetica, sans-serif" font-size="116" font-weight="900">2028</text>
    <path d="M57 264h200" stroke="#24b58d" stroke-width="5" stroke-linecap="round"/>
    <text x="157" y="305" text-anchor="middle" fill="#476577" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">OFFICIAL EXTENSION</text>
  </g>
  <g transform="translate(78 568)">
    <circle cx="12" cy="12" r="12" fill="#37e5b7"/>
    <path d="M7 12l4 4 7-9" fill="none" stroke="#061522" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="19" fill="#e7f2f6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Maccabi Haifa recruitment route closed for now</text>
  </g>
  <text x="1122" y="624" text-anchor="end" fill="#8ca7b6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ISRAEL SPORTS PULSE</text>
</svg>
