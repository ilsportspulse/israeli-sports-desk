<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Faroe Islands 33 Israel 31 at the M20 EHF EURO</title>
  <desc id="desc">Original ILSP score graphic for Israel's 33-31 defeat to the Faroe Islands, with Israel leading 17-15 at halftime and the World Championship qualification path still open.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06162b"/>
      <stop offset="0.56" stop-color="#0a3768"/>
      <stop offset="1" stop-color="#101a2d"/>
    </linearGradient>
    <linearGradient id="isr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fa8ff"/>
      <stop offset="1" stop-color="#b9ddff"/>
    </linearGradient>
    <pattern id="court" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#d8ecff" stroke-opacity="0.055" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#court)"/>
  <circle cx="1350" cy="-30" r="450" fill="#cf183d" opacity="0.13"/>
  <circle cx="190" cy="1010" r="520" fill="#2797ff" opacity="0.12"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="100" y="100" font-size="28" font-weight="800" letter-spacing="7" fill="#b9dcfb">ISRAEL SPORTS PULSE</text>
    <rect x="100" y="138" width="1400" height="4" rx="2" fill="#4fa8ff"/>
    <text x="100" y="230" font-size="29" font-weight="800" letter-spacing="5" fill="#79bbfa">M20 EHF EURO • PLACES 9–16</text>
    <text x="800" y="380" text-anchor="middle" font-size="36" font-weight="800" letter-spacing="7" fill="#d9ebfb">FULL TIME</text>
    <g filter="url(#shadow)">
      <text x="615" y="610" text-anchor="middle" font-size="210" font-weight="900" fill="#fff">33</text>
      <text x="800" y="595" text-anchor="middle" font-size="92" font-weight="500" fill="#7db9ed">–</text>
      <text x="985" y="610" text-anchor="middle" font-size="210" font-weight="900" fill="url(#isr)">31</text>
    </g>
    <text x="615" y="690" text-anchor="middle" font-size="31" font-weight="800" letter-spacing="4" fill="#ffd5dc">FAROE ISLANDS</text>
    <text x="985" y="690" text-anchor="middle" font-size="31" font-weight="800" letter-spacing="4" fill="#cbe7ff">ISRAEL</text>
    <rect x="390" y="746" width="820" height="86" rx="43" fill="#020a14" fill-opacity="0.72" stroke="#8ac5f7" stroke-opacity="0.32"/>
    <text x="800" y="801" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="4" fill="#fff">HALFTIME: FAROE ISLANDS 15–17 ISRAEL</text>
    <text x="100" y="930" font-size="23" font-weight="700" letter-spacing="3" fill="#b9dcfb">ONE WIN FROM A 2027 WORLD CHAMPIONSHIP PLACE</text>
    <text x="1500" y="930" text-anchor="end" font-size="22" font-weight="700" letter-spacing="3" fill="#69b4f7">ILSP EDITORIAL VISUAL</text>
  </g>
</svg>
