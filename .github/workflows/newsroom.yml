name: ILSP autonomous newsroom

# Cloud AI newsroom: discovers Israeli-sport stories, drafts + fact-checks them
# against the hard gates, and auto-publishes those that pass. Runs entirely in the
# cloud; a passing run commits to main and Vercel auto-deploys it live.

on:
  schedule:
    - cron: "11,41 * * * *" # hourly at :11 (UTC)
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "Max candidates to process this run"
        required: false
        default: "6"

concurrency:
  group: ilsp-newsroom
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Claude Code (CLI/subscription mode)
        run: npm install -g @anthropic-ai/claude-code

      - name: Run newsroom cycle (discover -> AI draft + verify -> gate)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOFASCORE_RAPIDAPI_KEY: ${{ secrets.SOFASCORE_RAPIDAPI_KEY }}
          NEWSROOM_MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '6' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/newsroom-run.mjs

      - name: Refresh governance evidence snapshot (keeps the full gate green)
        # Re-takes the 12h current-story snapshot from the freshest published
        # stories so the founder-governance suite stays valid without weakening it.
        run: node scripts/refresh-social-launch-snapshot.mjs

      - name: Quality gate (audit + tests must pass before publishing)
        run: |
          npm run audit
          npm test

      - name: Commit & push verified articles (Vercel auto-deploys)
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new content this cycle."
            exit 0
          fi
          git config user.name "fmgaming-core"
          git config user.email "230560160+fmgaming-core@users.noreply.github.com"
          git add -A
          git commit -m "Autonomous newsroom cycle: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
