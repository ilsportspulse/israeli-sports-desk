<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">ILSP story card 4 by 5 template</title>
  <desc id="desc">Premium navy and Israeli-blue social story template with a full-frame photography area, category, headline and context line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset="1" stop-color="#123366"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07152f" stop-opacity="0"/><stop offset="1" stop-color="#07152f" stop-opacity=".98"/></linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect x="48" y="48" width="984" height="720" rx="44" fill="#15345f" stroke="#31558c" stroke-width="3"/>
  <path d="M48 520h984v248H48z" fill="url(#fade)"/>
  <g fill="none" stroke="#6c85ad" stroke-width="3" stroke-dasharray="16 14" opacity=".7"><rect x="84" y="84" width="912" height="648" rx="28"/><path d="M470 408h140M540 338v140"/></g>
  <text x="540" y="520" text-anchor="middle" fill="#afbdd2" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" letter-spacing="4">FULL-FRAME LICENSED PHOTO</text>
  <g transform="translate(72 72)">
    <rect width="174" height="70" rx="21" fill="#07152f" stroke="#4f7dff" stroke-width="3"/>
    <text x="23" y="49" fill="#ffffff" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="37" font-style="italic" font-weight="900" letter-spacing="-4">ILSP</text>
    <path d="M151 13l5 9h10l-5 9 5 9h-10l-5 9-5-9h-10l5-9-5-9h10z" fill="#4f7dff"/>
  </g>
  <rect x="72" y="742" width="252" height="54" rx="18" fill="#155eef"/>
  <text x="94" y="778" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" letter-spacing="3">[CATEGORY]</text>
  <text x="72" y="896" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="900" letter-spacing="-2">
    <tspan x="72">[HEADLINE LINE 1]</tspan><tspan x="72" dy="78">[HEADLINE LINE 2]</tspan><tspan x="72" dy="78">[OPTIONAL LINE 3]</tspan>
  </text>
  <rect x="72" y="1180" width="936" height="2" fill="#35578c"/>
  <text x="72" y="1244" fill="#b7c3d5" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="600">[ONE VERIFIED CONTEXT LINE]</text>
  <text x="72" y="1302" fill="#4f7dff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" letter-spacing="4">ILPULSE.SPORT</text>
</svg>
