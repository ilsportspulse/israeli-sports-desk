<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">ILSP vertical story template</title>
  <desc id="desc">Nine-by-sixteen vertical template for verified alerts, explainers and archive features.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#061631"/><stop offset=".6" stop-color="#0b2854"/><stop offset="1" stop-color="#061631"/></linearGradient><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#061631" stop-opacity="0"/><stop offset="1" stop-color="#061631"/></linearGradient></defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <g transform="translate(64 70)"><text x="0" y="55" fill="#ffffff" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="57" font-style="italic" font-weight="900" letter-spacing="-6">ILSP</text><path d="M165 5l6 11h12l-6 11 6 11h-12l-6 11-6-11h-12l6-11-6-11h12z" fill="#4f7dff"/></g>
  <text x="1016" y="118" text-anchor="end" fill="#9fb1ca" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" letter-spacing="4">THE BEAT OF ISRAELI SPORT</text>
  <rect x="64" y="190" width="952" height="980" rx="48" fill="#17365f" stroke="#31558c" stroke-width="3"/>
  <g fill="none" stroke="#6c85ad" stroke-width="3" stroke-dasharray="17 15" opacity=".7"><rect x="106" y="232" width="868" height="896" rx="30"/><path d="M470 680h140M540 610v140"/></g>
  <text x="540" y="840" text-anchor="middle" fill="#afbdd2" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" letter-spacing="4">VERTICAL LICENSED MEDIA</text>
  <path d="M64 850h952v320H64z" fill="url(#fade)"/>
  <rect x="64" y="1100" width="292" height="62" rx="20" fill="#155eef"/>
  <text x="91" y="1141" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing="4">[FORMAT LABEL]</text>
  <text x="64" y="1290" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="-2"><tspan x="64">[HEADLINE LINE 1]</tspan><tspan x="64" dy="82">[HEADLINE LINE 2]</tspan><tspan x="64" dy="82">[HEADLINE LINE 3]</tspan></text>
  <rect x="64" y="1570" width="952" height="2" fill="#35578c"/>
  <text x="64" y="1646" fill="#c0cada" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="600"><tspan x="64">[VERIFIED CONTEXT OR QUESTION]</tspan><tspan x="64" dy="50">[OPTIONAL SECOND LINE]</tspan></text>
  <rect x="64" y="1790" width="952" height="78" rx="25" fill="#155eef"/>
  <text x="96" y="1841" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">READ / PLAY / FOLLOW</text>
  <text x="984" y="1841" text-anchor="end" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" letter-spacing="3">ILPULSE.SPORT</text>
</svg>
